<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Artifact</title>
<style>
  html, body { margin: 0; height: 100%; background: #070910; overflow: hidden; }
  canvas { display: block; }
  #hint { position: fixed; left: 16px; bottom: 14px; color: #8b93a7; font: 12px/1.4 system-ui, sans-serif;
          pointer-events: none; letter-spacing: .02em; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #8b93a7;
             font: 13px system-ui, sans-serif; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Generating textures…</div>
<div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ------------------------------------------------------------------ procedural noise (tileable)
function hash(x, y, s) { const n = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return n - Math.floor(n); }
const wrap = (a, P) => ((a % P) + P) % P;
function vnoise(x, y, P, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const x0 = wrap(xi, P), x1 = wrap(xi + 1, P), y0 = wrap(yi, P), y1 = wrap(yi + 1, P);
  const a = hash(x0, y0, s), b = hash(x1, y0, s), c = hash(x0, y1, s), d = hash(x1, y1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, P, oct, s) {
  let sum = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { sum += amp * vnoise(x * f, y * f, P * f, s + i * 13); norm += amp; amp *= 0.5; f *= 2; }
  return sum / norm;
}
function worley(x, y, P, s) {
  const xi = Math.floor(x), yi = Math.floor(y); let f1 = 9, f2 = 9, id = 0;
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const cx = xi + i, cy = yi + j, wx = wrap(cx, P), wy = wrap(cy, P);
    const px = cx + 0.15 + 0.7 * hash(wx, wy, s), py = cy + 0.15 + 0.7 * hash(wy, wx, s + 3);
    const d = Math.hypot(x - px, y - py);
    if (d < f1) { f2 = f1; f1 = d; id = hash(wx, wy, s + 9); } else if (d < f2) f2 = d;
  }
  return [f1, f2, id];
}
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;

// ------------------------------------------------------------------ PBR texture set from a height/colour/roughness function
function canvasTex(size, data, srgb) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').putImageData(new ImageData(data, size, size), 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = 8;
  return t;
}
function buildPBR(size, fn, strength) {
  const N = size * size, Hm = new Float32Array(N);
  const alb = new Uint8ClampedArray(N * 4), rgh = new Uint8ClampedArray(N * 4), nrm = new Uint8ClampedArray(N * 4);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const i = y * size + x, o = fn(x / size, y / size);
    Hm[i] = o.h;
    alb[i * 4] = o.c[0]; alb[i * 4 + 1] = o.c[1]; alb[i * 4 + 2] = o.c[2]; alb[i * 4 + 3] = 255;
    const r = o.r * 255; rgh[i * 4] = rgh[i * 4 + 1] = rgh[i * 4 + 2] = r; rgh[i * 4 + 3] = 255;
  }
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const i = y * size + x;
    const dx = Hm[y * size + (x + 1) % size] - Hm[y * size + (x - 1 + size) % size];
    const dy = Hm[((y + 1) % size) * size + x] - Hm[((y - 1 + size) % size) * size + x];
    let nx = -dx * strength, ny = dy * strength, nz = 1; const l = Math.hypot(nx, ny, nz);
    nrm[i * 4] = (nx / l * 0.5 + 0.5) * 255; nrm[i * 4 + 1] = (ny / l * 0.5 + 0.5) * 255;
    nrm[i * 4 + 2] = (nz / l * 0.5 + 0.5) * 255; nrm[i * 4 + 3] = 255;
  }
  return { map: canvasTex(size, alb, true), normalMap: canvasTex(size, nrm, false), roughnessMap: canvasTex(size, rgh, false) };
}

// weathered carved stone: grain, pits, hairline cracks; water sits in the cracks and pits
function stoneFn(u, v) {
  const n = fbm(u * 6, v * 6, 6, 5, 1), fine = fbm(u * 24, v * 24, 24, 3, 2);
  let h = n * 0.6 + fine * 0.4;
  const cr = Math.abs(fbm(u * 4, v * 4, 4, 4, 7) - 0.5);
  const crack = cr < 0.011 ? 1 - cr / 0.011 : 0;
  const pit = sstep(0.80, 0.9, vnoise(u * 48, v * 48, 48, 5));
  h -= crack * 0.3 + pit * 0.12;
  const stain = fbm(u * 3, v * 3, 3, 4, 11);
  const k = (0.62 + 0.38 * n) * (0.75 + 0.25 * stain) * (1 - crack * 0.5);
  const c = [mix(70, 112, k), mix(68, 106, k), mix(66, 98, k)];
  const wet = Math.max(crack, pit);
  return { h, c, r: mix(0.42 + 0.3 * fine, 0.06, wet) };
}
// wet cobblestones with mortar and standing puddles
function cobbleFn(u, v) {
  const [f1, f2, id] = worley(u * 6, v * 6, 6, 5);
  const stone = sstep(0.02, 0.12, f2 - f1);
  const grain = fbm(u * 32, v * 32, 32, 4, 3);
  let h = stone * (0.55 + 0.45 * (1 - Math.min(1, f1 * 1.4))) + 0.15 * grain * stone;
  const puddle = sstep(0.54, 0.62, fbm(u * 2, v * 2, 2, 4, 21));
  h = mix(h, 0.42, puddle * sstep(0.0, 0.5, 0.6 - h + 0.3));
  const tone = 0.7 + 0.3 * id, g = 0.85 + 0.15 * grain;
  let c = stone > 0.5 ? [86 * tone * g, 82 * tone * g, 78 * tone * g] : [38, 36, 34];
  c = c.map(x => x * mix(1, 0.55, puddle));
  const r = mix(stone > 0.5 ? 0.38 + 0.3 * grain : 0.8, 0.03, puddle);
  return { h, c, r };
}
// small rain ripples for the clear-coat water film
function rippleFn(u, v) {
  const h = fbm(u * 8, v * 8, 8, 4, 40);
  return { h, c: [128, 128, 255], r: 0.1 };
}

// ------------------------------------------------------------------ renderer, scene, camera
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070910);
scene.fog = new THREE.FogExp2(0x070910, 0.075);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.05, 100);
camera.position.set(2.5, 2.25, 3.1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.65, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.6;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.addEventListener('start', () => { controls.autoRotate = false; });

// ------------------------------------------------------------------ materials
const stoneTex = buildPBR(512, stoneFn, 6);
const cobbleTex = buildPBR(512, cobbleFn, 9);
const rippleTex = buildPBR(256, rippleFn, 4).normalMap;
rippleTex.repeat.set(18, 18);

for (const t of Object.values(stoneTex)) t.repeat.set(4, 3.5);
const stoneMat = new THREE.MeshPhysicalMaterial({
  ...stoneTex, normalScale: new THREE.Vector2(1.2, 1.2), roughness: 1, metalness: 0,
  clearcoat: 0.85, clearcoatRoughness: 0.12, envMapIntensity: 0.35,
});
for (const t of Object.values(cobbleTex)) t.repeat.set(7, 7);
const groundMat = new THREE.MeshPhysicalMaterial({
  ...cobbleTex, normalScale: new THREE.Vector2(1.4, 1.4), roughness: 1, metalness: 0,
  clearcoat: 0.6, clearcoatRoughness: 0.08, clearcoatNormalMap: rippleTex,
  clearcoatNormalScale: new THREE.Vector2(0.12, 0.12), envMapIntensity: 0.4,
});
const crystalMat = new THREE.MeshPhysicalMaterial({
  color: 0xcfeeff, metalness: 0, roughness: 0.04, transmission: 1, thickness: 0.9, ior: 1.55,
  attenuationColor: new THREE.Color(0.35, 0.75, 1.0), attenuationDistance: 2.4,
  specularIntensity: 1, iridescence: 0.35, iridescenceIOR: 1.3, envMapIntensity: 2.2,
  emissive: new THREE.Color(0.05, 0.22, 0.38), emissiveIntensity: 0.9,
  flatShading: true,
});

// ------------------------------------------------------------------ ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ------------------------------------------------------------------ pedestal (lathe profile of a carved plinth)
const prof = [[0.001, 0], [1.05, 0], [1.05, 0.12], [0.96, 0.15], [0.96, 0.27], [0.84, 0.30], [0.66, 0.35],
  [0.56, 0.42], [0.49, 0.47], [0.46, 0.55], [0.43, 1.12], [0.47, 1.16], [0.58, 1.22], [0.70, 1.28],
  [0.74, 1.31], [0.74, 1.40], [0.70, 1.42], [0.001, 1.42]].map(([r, y]) => new THREE.Vector2(r, y));
const pedestal = new THREE.Mesh(new THREE.LatheGeometry(prof, 96), stoneMat);
pedestal.castShadow = pedestal.receiveShadow = true;
scene.add(pedestal);

// ------------------------------------------------------------------ rock matrix the crystals grow from
let rockGeo = mergeVertices(new THREE.IcosahedronGeometry(1, 4));
{
  const p = rockGeo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).normalize();
    const u = Math.atan2(v.z, v.x) / (2 * Math.PI) + 0.5, w = Math.acos(v.y) / Math.PI;
    v.multiplyScalar(1 + 0.32 * (fbm(u * 6, w * 4, 6, 4, 50) - 0.5));
    p.setXYZ(i, v.x, v.y, v.z);
  }
  rockGeo.computeVertexNormals();
}
const rock = new THREE.Mesh(rockGeo, stoneMat);
rock.scale.set(0.42, 0.17, 0.38);
rock.position.y = 1.44;
rock.castShadow = rock.receiveShadow = true;
scene.add(rock);

// ------------------------------------------------------------------ crystal cluster
function crystalGeo(r, h) {
  const pts = [[0.0005, 0], [r * 0.82, 0], [r, h * 0.08], [r * 0.97, h * 0.78], [0.0005, h]]
    .map(([x, y]) => new THREE.Vector2(x, y));
  const g = new THREE.LatheGeometry(pts, 6).toNonIndexed();
  g.computeVertexNormals();
  return g;
}
const cluster = new THREE.Group();
cluster.position.y = 1.47;
scene.add(cluster);
const main = new THREE.Mesh(crystalGeo(0.17, 1.15), crystalMat);
main.position.y = -0.05;
cluster.add(main);
const shards = [[0.0, 0.24, 0.62, 0.10, 0.42], [1.1, 0.22, 0.48, 0.08, 0.55], [2.0, 0.27, 0.70, 0.11, 0.35],
  [2.9, 0.20, 0.38, 0.07, 0.62], [3.8, 0.26, 0.55, 0.09, 0.45], [4.7, 0.21, 0.44, 0.07, 0.58],
  [5.5, 0.25, 0.66, 0.10, 0.38], [0.6, 0.12, 0.80, 0.12, 0.18]];
const up = new THREE.Vector3(0, 1, 0);
for (const [a, d, h, r, tilt] of shards) {
  const m = new THREE.Mesh(crystalGeo(r, h), crystalMat);
  m.position.set(Math.cos(a) * d, -0.06, Math.sin(a) * d);
  const axis = new THREE.Vector3(-Math.sin(a), 0, Math.cos(a));
  m.quaternion.setFromAxisAngle(axis, -tilt).multiply(new THREE.Quaternion().setFromAxisAngle(up, a));
  cluster.add(m);
}
// glowing core seen through the main crystal
const coreBase = new THREE.Color(0.55, 1.6, 2.6);
const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.08, 0),
  new THREE.MeshBasicMaterial({ color: coreBase.clone(), toneMapped: true }));
core.scale.set(1, 3.2, 1);
core.position.y = 0.42;
cluster.add(core);
const glow = new THREE.PointLight(0x66ccff, 7, 6, 2);
glow.position.set(0, 1.95, 0);
scene.add(glow);

// ------------------------------------------------------------------ lights: key (soft shadows), rim, fill
const key = new THREE.DirectionalLight(0xffe8d0, 2.4);
key.position.set(4.5, 7.5, 3.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3.5, right: 3.5, top: 3.5, bottom: -3.5, near: 1, far: 20 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.SpotLight(0x7fb4ff, 60, 14, 0.5, 0.8, 2);
rim.position.set(-3.5, 3.6, -4.5);
rim.target.position.set(0, 1.4, 0);
scene.add(rim, rim.target);
scene.add(new THREE.HemisphereLight(0x223044, 0x0b0a08, 0.25));

// ------------------------------------------------------------------ floating motes
const moteTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const MOTES = 180, motePos = new Float32Array(MOTES * 3), moteSpd = new Float32Array(MOTES);
for (let i = 0; i < MOTES; i++) {
  const a = Math.random() * Math.PI * 2, d = 0.25 + Math.random() * 1.3;
  motePos.set([Math.cos(a) * d, 1.4 + Math.random() * 2.2, Math.sin(a) * d], i * 3);
  moteSpd[i] = 0.04 + Math.random() * 0.12;
}
const moteGeo = new THREE.BufferGeometry();
moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
const motes = new THREE.Points(moteGeo, new THREE.PointsMaterial({
  size: 0.035, map: moteTex, color: new THREE.Color(0.7, 1.4, 2.2), transparent: true,
  depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
}));
scene.add(motes);

// ------------------------------------------------------------------ post-processing: bloom, tone mapping, SMAA
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.6, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const smaa = new SMAAPass(innerWidth * renderer.getPixelRatio(), innerHeight * renderer.getPixelRatio());
composer.addPass(smaa);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
  smaa.setSize(innerWidth * renderer.getPixelRatio(), innerHeight * renderer.getPixelRatio());
});

// ------------------------------------------------------------------ loop
document.getElementById('loading').remove();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const pulse = 0.78 + 0.18 * Math.sin(t * 1.7) + 0.04 * Math.sin(t * 7.3);
  core.material.color.copy(coreBase).multiplyScalar(pulse);
  glow.intensity = 7 * pulse;
  cluster.rotation.y = t * 0.05;
  rippleTex.offset.set(t * 0.012, t * 0.007);
  for (let i = 0; i < MOTES; i++) {
    let y = motePos[i * 3 + 1] + moteSpd[i] * dt;
    if (y > 3.8) y = 1.4;
    motePos[i * 3 + 1] = y;
    motePos[i * 3] += Math.sin(t * 0.6 + i) * 0.0008;
  }
  moteGeo.attributes.position.needsUpdate = true;
  controls.update();
  composer.render();
});
</script>
</body>
</html>
