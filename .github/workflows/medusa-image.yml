# Builds the Medusa backend image on GitHub's free runners and publishes it to GitHub Container Registry.
# Render's free plan then just pulls ghcr.io/johnyumang/jrly-medusa:latest — no heavy build on 512 MB.
name: Medusa backend image

on:
  push:
    branches: [main, claude/medusa-free-hosting]
    paths:
      - projects/ecommerce-template/backend/**
      - projects/ecommerce-template/content/catalog.ts
      - projects/ecommerce-template/public/stock/**
      - .github/workflows/medusa-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: medusa-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ecommerce-template/backend
    steps:
      - uses: actions/checkout@v4

      - name: Bundle catalogue and stock photos
        run: node scripts/sync-catalog.mjs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jrly-medusa
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "tags=$IMAGE:latest,$IMAGE:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:preview,$IMAGE:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: projects/ecommerce-template/backend
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy on Render (optional)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" >/dev/null && echo "Render redeploy triggered"
