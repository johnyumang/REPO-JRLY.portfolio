<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-header></div>

  <main id="main" tabindex="-1">
    <section class="page-hero scanlines" aria-labelledby="lb-title">
      <div class="bg"><img src="images/hero/city_neon_signs_alley_01.jpg" alt="" decoding="async"></div>
      <div class="container">

    <section class="section" style="padding-top:16px" aria-label="Lookbook gallery">
      <div class="container">
        <div class="masonry" data-masonry></div>
      </div>
    </section>

  <div data-footer></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      var St = window.Store;
      document.querySelector('[data-masonry]').innerHTML = St.S.lookbook.map(function (l, i) {
        var label = St.categoryLabel(l.shop);
        return '<figure><a href="shop.html?category=' + encodeURIComponent(l.shop) + '"><img src="' + St.esc(l.src) + '" alt="' + St.esc(l.alt) + '"' + (i > 3 ? ' loading="lazy"' : '') + ' decoding="async"><figcaption>Shop ' + St.esc(label) + '</figcaption></a></figure>';
      }).join('');
    })();
  </script>
